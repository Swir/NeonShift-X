name: README Docs

on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - STATUS.md
      - assets/readme/**
      - tools/readme_progress.py
      - .github/workflows/readme-docs.yml
  push:
    branches: [main]
    paths:
      - README.md
      - STATUS.md
      - assets/readme/**
      - tools/readme_progress.py
      - .github/workflows/readme-docs.yml

jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify README progress presentation
        run: python tools/readme_progress.py --check
