<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">NeonShift X — macro and activity engine</title><desc id="desc">Dark electric-cyan SWIR banner for NeonShift X, a Windows macro recorder and activity engine.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02050A"/><stop offset=".55" stop-color="#06101A"/><stop offset="1" stop-color="#02050A"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0088FF"/><stop offset=".45" stop-color="#62E5FF"/><stop offset="1" stop-color="#0088FF"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity=".055"/></pattern></defs><rect width="1200" height="320" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity=".25"/><rect width="1200" height="320" rx="26" fill="url(#grid)"/><path d="M0 250 C180 210 250 300 430 258 S720 214 885 248 S1070 282 1200 232" fill="none" stroke="url(#cyan)" stroke-opacity=".24" stroke-width="2"/><g transform="translate(72 74)"><rect width="150" height="150" rx="30" fill="#07111C" stroke="#62E5FF" stroke-opacity=".5"/><path d="M39 38 75 69 111 38 124 55 91 81 124 108 111 125 75 94 39 125 26 108 59 81 26 55Z" fill="none" stroke="#62E5FF" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/></g><text x="270" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR PROJECT</text><text x="270" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" fill="#F4FAFF">NEONSHIFT X</text><text x="27